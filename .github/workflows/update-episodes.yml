name: Auto-Sync New Podcast Episodes

on:
  schedule:
    # Runs automatically every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from the Actions tab

permissions:
  contents: write # Required so the bot can commit updates back to main

jobs:
  sync-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse RSS & Update index.html
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const https = require('https');

            const RSS_URL = 'https://anchor.fm/s/100cf5c64/podcast/rss';
            const FILE_PATH = 'index.html';

            function fetchText(url) {
              return new Promise((resolve, reject) => {
                https.get(url, { headers: { 'User-Agent': 'GitHub-Actions-RSS-Sync' } }, (res) => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    return resolve(fetchText(res.headers.location));
                  }
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve(data));
                }).on('error', reject);
              });
            }

            function cleanXmlText(str) {
              if (!str) return '';
              return str
                .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
                .replace(/<[^>]+>/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&quot;/g, '"')
                .replace(/&#39;|&apos;/g, "'")
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/\s+/g, ' ')
                .trim();
            }

            function extractTags(title, summary) {
              const combined = `${title} ${summary}`;
              const tags = new Set();

              // Extract guest name if title includes "with [Guest Name]"
              const guestMatch = title.match(/\bwith\s+(?:Prof\.|Dr\.|Rabbi|Amb\.|Rep\.)?\s*([A-Z][a-zA-Z\-]+(?:\s+[A-Z][a-zA-Z\-]+){1,2})/);
              if (guestMatch) tags.add(guestMatch[1].trim());

              const keywordRules = [
                [/gaza/i, 'Gaza War'],
                [/hamas/i, 'Hamas'],
                [/hostage/i, 'Hostage Negotiations'],
                [/iran|tehran|ayatollah|irgc/i, 'Iran'],
                [/hezbollah|lebanon/i, 'Hezbollah'],
                [/netanyahu/i, 'Benjamin Netanyahu'],
                [/election|coalition|knesset/i, '2026 Elections'],
                [/haredi|ultra-orthodox|draft|conscription/i, 'Haredi Integration'],
                [/trump|biden|white house|america|democrat|republican/i, 'US-Israel Relations'],
                [/antisemit|diaspora|campus/i, 'Antisemitism'],
                [/zionis/i, 'Zionism'],
                [/judicial|supreme court/i, 'Judicial Reform'],
                [/syria|joulani/i, 'Syria'],
                [/turkey|erdogan/i, 'Turkey'],
                [/qatar|doha/i, 'Qatar'],
                [/egypt/i, 'Egypt'],
                [/unrwa|united nations|\bun\b/i, 'United Nations']
              ];

              for (const [regex, label] of keywordRules) {
                if (regex.test(combined) && tags.size < 4) tags.add(label);
              }
              if (tags.size === 0) tags.add('Israeli History & Politics');
              return Array.from(tags).slice(0, 4);
            }

            const xml = await fetchText(RSS_URL);
            let html = fs.readFileSync(FILE_PATH, 'utf8');

            // Find all existing episode numbers in RAW_EPISODES
            const existingNums = new Set();
            const epRegex = /\[\s*(\d+)\s*,\s*"/g;
            let m;
            while ((m = epRegex.exec(html)) !== null) {
              existingNums.add(Number(m[1]));
            }

            const items = xml.split('<item>').slice(1);
            const newEntries = [];

            for (const rawItem of items) {
              const titleMatch = rawItem.match(/<title>([\s\S]*?)<\/title>/);
              const descMatch = rawItem.match(/<description>([\s\S]*?)<\/description>/);
              const linkMatch = rawItem.match(/<link>([\s\S]*?)<\/link>/);

              if (!titleMatch) continue;
              const fullTitle = cleanXmlText(titleMatch[1]);

              // Match numbered episodes like "154: Title" or "Episode 154: Title"
              const numMatch = fullTitle.match(/^(?:Episode\s*)?(\d+)\s*[:\-–]\s*(.+)$/i);
              if (!numMatch) continue;

              const epNum = Number(numMatch[1]);
              const cleanTitle = numMatch[2].trim();

              if (existingNums.has(epNum)) continue;

              const rawDesc = cleanXmlText(descMatch ? descMatch[1] : '');
              const paragraphs = rawDesc
                .split(/--+|(?<=[.?!])\s+/)
                .map(s => s.trim())
                .filter(s => s.length > 25 && !/patreon|substack|buymeacoffee|buy me a coffee|merch|tiktok|instagram|sponsored by|keep the lights on|musical intro|email us at/i.test(s));

              const summary = paragraphs.slice(0, 2).join(' ') || 'New episode of Ask Haviv Anything.';
              const link = linkMatch ? cleanXmlText(linkMatch[1]) : null;
              const tags = extractTags(cleanTitle, summary);

              const entry = link ? [epNum, cleanTitle, summary, tags, link] : [epNum, cleanTitle, summary, tags];
              newEntries.push(entry);
              existingNums.add(epNum);
            }

            if (newEntries.length === 0) {
              console.log('No new episodes found. Archive is up to date.');
              return;
            }

            // Sort newest first so highest episode number stays at the top
            newEntries.sort((a, b) => b[0] - a[0]);
            const formattedLines = newEntries.map(e => `      ${JSON.stringify(e)},`).join('\n');

            const targetMarker = 'const RAW_EPISODES = [';
            if (!html.includes(targetMarker)) {
              throw new Error('Could not find RAW_EPISODES marker in index.html');
            }

            html = html.replace(targetMarker, `${targetMarker}\n${formattedLines}`);
            fs.writeFileSync(FILE_PATH, html, 'utf8');
            console.log(`Added ${newEntries.length} new episode(s):`, newEntries.map(e => e[0]));

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add index.html
            git commit -m "chore: auto-sync new episodes from RSS feed"
            git push
          else
            echo "No changes to commit."
          fi
